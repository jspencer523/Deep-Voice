<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <title>deepvoice — philosophy in comics and voice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="back" id="backBtn" aria-label="Back">‹</button>
    <div class="wordmark" onclick="goHome()">
      <span class="glyph">✦</span><span>deep<span class="v">voice</span></span>
      <small>philosophy · comics · voice</small>
    </div>
  </div>

  <div id="app"></div>
</div>

<!-- Socratic Problem Modal -->
<div id="socraticProblemModal" class="modal-overlay" style="display:none;">
  <!-- [Same modal HTML as before - I'll include the full version below] -->
</div>

<!-- Filter Modal -->
<div id="filterModal" class="modal-overlay" style="display:none;">
  <div class="modal-container filter-modal">
    <button class="modal-close" onclick="closeFilterModal()">×</button>
    <div class="modal-header">
      <h2>🎯 Browse Options</h2>
    </div>
    <div class="modal-content">
      <div class="filter-section">
        <h3>Browse by Time Period</h3>
        <div class="filter-buttons" id="timeFilters"></div>
      </div>
      <div class="filter-section">
        <h3>Cultural Background</h3>
        <div class="filter-buttons" id="cultureFilters"></div>
      </div>
      <div class="filter-actions">
        <button class="filter-btn" onclick="clearAllFilters()">Reset Filters</button>
        <button class="filter-btn primary" onclick="applyFilters()">Apply</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
